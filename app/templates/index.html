<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>

<style>
body{
    margin:0;
    height:100vh;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#0f0f1a,#1a1a2e,#16213e);
    color:white;
    font-family:"Segoe UI", Arial, sans-serif;
}

.card{
    width:320px;
    padding:40px;
    text-align:center;
    background:#151518;
    border:1px solid #333;
    border-radius:25px;
    box-shadow:0 0 25px rgba(0,255,255,0.2);
    transition:transform 0.3s ease, box-shadow 0.3s ease;
}
.card:hover{
    transform:translateY(-5px);
    box-shadow:0 0 35px rgba(0,255,255,0.4);
}

.mic{
    width:90px;
    height:90px;
    border:0;
    border-radius:50%;
    font-size:35px;
    cursor:pointer;
    background:radial-gradient(circle,#00f2ff,#0077ff);
    color:#fff;
    transition:transform 0.2s ease, box-shadow 0.3s ease;
}
.mic:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px #00f2ff;
}
.listening{
    transform:scale(1.2);
    box-shadow:0 0 30px #00f2ff;
    animation:pulse 1.5s infinite;
}
@keyframes pulse{
    0%{box-shadow:0 0 10px #00f2ff;}
    50%{box-shadow:0 0 25px #00f2ff;}
    100%{box-shadow:0 0 10px #00f2ff;}
}

.status{
    margin-top:20px;
    color:#0ff;
    font-weight:bold;
    letter-spacing:1px;
    transition:color 0.3s ease;
}

.song{
    margin-top:15px;
    font-size:14px;
    color:#ffcc00;
    font-style:italic;
}
</style>
</head>

<body>

<div class="card">

    <h2>Nova AI</h2>

    <p>Say a song name</p>

    <button id="mic" class="mic">
        🎙️
    </button>

    <div id="status" class="status">
        Tap microphone
    </div>

    <div id="song" class="song"></div>

</div>

<script>
const mic=document.getElementById("mic");
const status=document.getElementById("status");
const song=document.getElementById("song");

const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let youtubeTab=null;
let listening=false;

if(!SpeechRecognition){
    status.textContent="Speech recognition unavailable";
    mic.disabled=true;
}else{
    const recognition=new SpeechRecognition();
    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;

    recognition.onstart=()=>{
        listening=true;
        mic.classList.add("listening");
        status.textContent="Listening...";
    };

    recognition.onend=()=>{
        listening=false;
        mic.classList.remove("listening");
    };

    recognition.onerror=()=>{
        listening=false;
        mic.classList.remove("listening");
        status.textContent="Try again";
    };

    recognition.onresult=async(event)=>{
        const command=event.results[0][0].transcript.trim();
        if(!command){
            status.textContent="No song detected";
            return;
        }
        song.textContent=command;
        status.textContent="Finding song...";
        try{
            const response=await fetch("/youtube/play",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({command:command})
            });
            const data=await response.json();
            if(!data.success){
                status.textContent=data.message||"Song not found";
                return;
            }
            if(!youtubeTab||youtubeTab.closed){
                youtubeTab=window.open(data.url,"NovaYouTube");
            }else{
                youtubeTab.location.href=data.url;
                youtubeTab.focus();
            }
            status.textContent="Playing";
        }catch(error){
            console.error(error);
            status.textContent="Server connection failed";
        }
    };

    mic.onclick=()=>{
        if(listening) return;
        try{recognition.start();}catch(error){console.log(error);}
    };
}
</script>

</body>
</html>
